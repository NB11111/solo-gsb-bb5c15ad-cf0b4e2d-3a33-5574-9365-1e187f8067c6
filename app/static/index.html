<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分支访谈脚本编辑器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🎙️ 分支访谈脚本编辑器</div>
  <div class="script-switch">
    <select id="script-select" title="切换脚本"></select>
    <button id="btn-new" class="btn" title="新建脚本">＋ 新建</button>
  </div>
  <input id="title-input" class="title-input" placeholder="访谈标题">
  <span id="dirty-dot" class="dirty-dot" title="有未保存的修改"></span>
  <div class="topbar-actions">
    <button id="btn-add-node" class="btn">＋ 问题节点</button>
    <button id="btn-run" class="btn btn-primary">▶ 运行预览</button>
    <button id="btn-validate" class="btn">🔍 校验</button>
    <button id="btn-save" class="btn btn-success">💾 保存</button>
    <button id="btn-export" class="btn">⤓ 导出 JSON</button>
    <button id="btn-import" class="btn">⤒ 导入 JSON</button>
    <button id="btn-share" class="btn">🔗 只读分享</button>
    <button id="btn-runs" class="btn">📜 运行记录</button>
    <button id="btn-delete" class="btn btn-danger" title="删除当前脚本">🗑</button>
  </div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</header>

<main class="workspace">
  <section class="canvas-wrap" id="canvas-wrap">
    <div class="canvas-inner" id="canvas-inner">
      <svg id="edge-layer" class="edge-layer">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
                  orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,3 L0,6 Z" fill="#8a94a6"></path>
          </marker>
          <marker id="arrow-cycle" markerWidth="10" markerHeight="10" refX="8" refY="3"
                  orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,3 L0,6 Z" fill="#e5484d"></path>
          </marker>
        </defs>
      </svg>
      <div id="nodes-layer" class="nodes-layer"></div>
      <div class="canvas-hint">双击空白处添加问题节点 · 拖拽节点移动 · 从选项右侧圆点拉线连接</div>
    </div>
  </section>

  <aside class="panel">
    <h2>实时校验</h2>
    <div id="validation-summary" class="validation-summary"></div>
    <ul id="issue-list" class="issue-list"></ul>
  </aside>
</main>

<!-- 运行预览 -->
<div class="modal-backdrop" id="run-modal" hidden>
  <div class="modal modal-run">
    <div class="modal-head">
      <h3>▶ 运行预览</h3>
      <button class="modal-close" data-close="run-modal">×</button>
    </div>
    <div class="modal-body">
      <div id="run-question" class="run-question"></div>
      <div id="run-options" class="run-options"></div>
      <div class="run-end" id="run-end" hidden>
        <p>✅ 访谈结束</p>
        <button class="btn" id="run-copy-path">复制本次路径 JSON</button>
        <button class="btn" id="run-restart">重新开始</button>
      </div>
    </div>
    <div class="modal-foot">
      <div class="run-breadcrumb" id="run-breadcrumb"></div>
      <button class="btn" id="run-back" hidden>← 上一步</button>
      <button class="btn" id="run-abort">结束并记录</button>
    </div>
  </div>
</div>

<!-- 只读分享 -->
<div class="modal-backdrop" id="share-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>🔗 只读分享链接</h3>
      <button class="modal-close" data-close="share-modal">×</button>
    </div>
    <div class="modal-body">
      <p class="muted">链接持有者只能查看流程图、执行预览，不能编辑；保存后分享内容不会自动更新，重新打开链接即为最新版。</p>
      <button class="btn btn-primary" id="share-create">生成新链接</button>
      <ul id="share-list" class="share-list"></ul>
    </div>
  </div>
</div>

<!-- 运行记录 -->
<div class="modal-backdrop" id="runs-modal" hidden>
  <div class="modal modal-wide">
    <div class="modal-head">
      <h3>📜 运行记录</h3>
      <button class="modal-close" data-close="runs-modal">×</button>
    </div>
    <div class="modal-body">
      <ul id="runs-list" class="runs-list"></ul>
    </div>
  </div>
</div>

<div id="toast-host" class="toast-host"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/validator.js"></script>
<script src="/static/js/canvas.js"></script>
<script src="/static/js/runner.js"></script>
<script src="/static/js/editor.js"></script>
</body>
</html>
